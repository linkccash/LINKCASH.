
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINKCASH - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:#050505;color:white;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#111;border:1px solid #d4a72c;border-radius:18px;padding:25px}
.logo{text-align:center;color:#d4a72c;font-size:30px;font-weight:bold;margin-bottom:10px}
h2{text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#aaa;font-size:13px;margin-bottom:22px}
label{display:block;margin:14px 0 7px;font-size:13px}
input{width:100%;padding:14px;background:#080808;border:1px solid #444;border-radius:8px;color:white;outline:none}
input:focus{border-color:#d4a72c}
button{width:100%;padding:15px;margin-top:22px;background:#d4a72c;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
#message{margin-top:15px;text-align:center;font-size:13px;color:#ff7777}
.links{text-align:center;margin-top:18px;color:#aaa;font-size:13px}
a{color:#d4a72c;text-decoration:none}
</style>
</head>

<body>
<div class="card">
<div class="logo">LINKCASH</div>
<h2>WELCOME BACK</h2>
<p class="sub">Login to your LINKCASH account</p>

<form id="loginForm">

<label>Email Address</label>
<input id="email" type="email" required placeholder="Enter your email">

<label>Password</label>
<input id="password" type="password" required placeholder="Enter password">

<button id="loginBtn" type="submit">LOGIN</button>
<div id="message"></div>

</form>

<div class="links">
Don't have an account? <a href="register.html">Register</a>
</div>
</div>

<script>
// REPLACE WITH YOUR SUPABASE DETAILS
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit",async function(e){
e.preventDefault();

button.disabled=true;
button.textContent="LOGGING IN...";
message.textContent="";

try{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const {data,error}=await db.auth.signInWithPassword({
email,
password
});

if(error) throw error;

const {data:profile,error:profileError}=await db
.from("profiles")
.select("id,username,status,role")
.eq("id",data.user.id)
.single();

if(profileError) throw profileError;

if(profile.status==="rejected"){
await db.auth.signOut();
throw new Error("Your account has been rejected. Contact CEO.");
}

if(profile.role==="ceo"){
window.location.href="ceodashboard.html";
return;
}

if(profile.status==="pending"){
window.location.href="pending-dashboard.html";
return;
}

if(profile.status==="active" || profile.status==="activated"){
window.location.href="dashboard.html";
return;
}

throw new Error("Account status not recognized. Contact support.");

}catch(error){

message.textContent=error.message || "Login failed.";

}finally{

button.disabled=false;
button.textContent="LOGIN";

}
});
</script>
</body>
</html>
